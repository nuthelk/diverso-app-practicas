<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D382A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Diverso — Panel de Agencias</title>
    <script>
      // Tema antes del primer render para evitar destello. Misma regla que src/shared/lib/tema.ts:
      // lo elegido gana (claro/oscuro, y los viejos light/dark); si no, se sigue al sistema.
      (function () {
        var guardado = null;
        try {
          guardado = localStorage.getItem('diverso-panel-theme');
        } catch (_) {}
        var oscuro =
          guardado === 'oscuro' ||
          guardado === 'dark' ||
          (guardado !== 'claro' &&
            guardado !== 'light' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root" style="display: contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
