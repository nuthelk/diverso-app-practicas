<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E6E4F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Diverso — Panel de Agencias</title>
    <script>
      // Tema antes del primer render para evitar destello.
      const t = localStorage.getItem('diverso-panel-theme');
      if (t === 'light') document.documentElement.classList.remove('dark');
      window.__consoleErrores = [];
      console.error = (...a) => {
        window.__consoleErrores.push(a.map(String).join(' '));
        console.warn(...a);
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
