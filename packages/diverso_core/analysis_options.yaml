# Reglas estrictas compartidas con apps/viajero. avoid_catches_without_on_clauses y
# avoid_dynamic_calls solo están en el núcleo por ahora (viajero las suma en F5).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_named_constants

formatter:
  page_width: 100
